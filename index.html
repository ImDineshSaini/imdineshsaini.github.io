<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinesh Saini — We've Moved!</title>
  <meta name="description" content="Dinesh Saini's website has moved to dineshksaini.com">
  <meta http-equiv="refresh" content="15;url=https://dineshksaini.com">
  <link rel="canonical" href="https://dineshksaini.com">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1814;
      --surface: #23201b;
      --text: #e8e4dc;
      --text-muted: #9e9a90;
      --accent: #d97757;
      --accent-glow: rgba(217, 119, 87, 0.3);
      --green: #788c5d;
      --blue: #6a9bcc;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 300px; height: 300px;
      background: var(--accent);
      top: -80px; left: -60px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 250px; height: 250px;
      background: var(--blue);
      bottom: -60px; right: -40px;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 200px; height: 200px;
      background: var(--green);
      top: 50%; left: 60%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Grain texture */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 640px;
      padding: 40px 24px;
    }

    /* Animated arrow icon */
    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px; height: 80px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid rgba(217, 119, 87, 0.2);
      margin-bottom: 32px;
      animation: fadeUp 0.8s ease-out both;
      position: relative;
    }

    .icon-wrap::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 24px;
      background: var(--accent-glow);
      filter: blur(16px);
      opacity: 0;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.6; }
    }

    .icon-wrap svg {
      color: var(--accent);
      animation: bounce-arrow 2s ease-in-out infinite;
    }

    @keyframes bounce-arrow {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(217, 119, 87, 0.12);
      color: var(--accent);
      border: 1px solid rgba(217, 119, 87, 0.25);
      margin-bottom: 24px;
      animation: fadeUp 0.8s ease-out 0.1s both;
    }

    h1 {
      font-family: 'Lora', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 16px;
      animation: fadeUp 0.8s ease-out 0.2s both;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-family: 'Lora', serif;
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 36px;
      animation: fadeUp 0.8s ease-out 0.3s both;
    }

    /* New URL display */
    .new-url {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid rgba(217, 119, 87, 0.2);
      border-radius: 12px;
      padding: 14px 24px;
      margin-bottom: 32px;
      font-size: 1rem;
      color: var(--text);
      animation: fadeUp 0.8s ease-out 0.4s both;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .new-url:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .new-url .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .new-url code {
      font-family: 'Poppins', monospace;
      font-weight: 600;
      color: var(--accent);
    }

    /* CTA button */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s, background 0.3s;
      animation: fadeUp 0.8s ease-out 0.5s both;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
      background: #e08565;
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    .cta-btn svg {
      transition: transform 0.3s;
    }

    .cta-btn:hover svg {
      transform: translateX(4px);
    }

    /* Countdown */
    .countdown {
      margin-top: 28px;
      font-size: 0.85rem;
      color: var(--text-muted);
      animation: fadeUp 0.8s ease-out 0.6s both;
    }

    .countdown strong {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      animation: fadeUp 0.8s ease-out 0.7s both;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Particles */
    .particle {
      position: fixed;
      width: 4px; height: 4px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      animation: sparkle 4s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0); }
      50% { opacity: 0.8; transform: translateY(-40px) scale(1); }
    }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <canvas id="confetti"></canvas>

  <div class="container">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </div>

    <div class="badge">New Home</div>

    <h1>I've moved to a <span>new place!</span></h1>

    <p class="subtitle">
      Hey there! My portfolio has a brand new home with a fresh design, better performance, and all the latest updates. Come check it out!
    </p>

    <div class="new-url">
      <span class="dot"></span>
      <code>dineshksaini.com</code>
      <span style="color: var(--green); font-size: 0.8rem; font-weight: 500;">Live</span>
    </div>

    <br>

    <a href="https://dineshksaini.com" class="cta-btn" id="cta">
      Visit New Site
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </a>

    <p class="countdown">
      Auto-redirecting in <strong id="timer">15</strong> seconds
    </p>
  </div>

  <footer class="footer">
    &copy; 2026 Dinesh Saini &middot; Now at <a href="https://dineshksaini.com">dineshksaini.com</a>
  </footer>

  <script>
    // Countdown timer
    (function() {
      let seconds = 15;
      const timerEl = document.getElementById('timer');
      const interval = setInterval(() => {
        seconds--;
        if (timerEl) timerEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = 'https://dineshksaini.com';
        }
      }, 1000);
    })();

    // Floating particles
    (function() {
      const colors = ['#d97757', '#788c5d', '#6a9bcc', '#e8e4dc'];
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = Math.random() * 100 + 'vh';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDelay = (Math.random() * 4) + 's';
        p.style.animationDuration = (3 + Math.random() * 3) + 's';
        p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
        document.body.appendChild(p);
      }
    })();

    // Confetti burst on CTA click
    (function() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let animating = false;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function createParticles(x, y) {
        const colors = ['#d97757', '#788c5d', '#6a9bcc', '#e8e4dc', '#C15F3C', '#FFD700'];
        for (let i = 0; i < 60; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 3 + Math.random() * 6;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            size: 3 + Math.random() * 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1,
            decay: 0.01 + Math.random() * 0.02,
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 10
          });
        }
        if (!animating) {
          animating = true;
          animate();
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, i) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.life -= p.decay;
          p.rotation += p.rotSpeed;
          if (p.life <= 0) { particles.splice(i, 1); return; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        });
        if (particles.length > 0) {
          requestAnimationFrame(animate);
        } else {
          animating = false;
        }
      }

      document.getElementById('cta').addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
    })();
  </script>
</body>
</html>
